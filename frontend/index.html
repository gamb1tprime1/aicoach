<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Coach — IELTS / TOEFL / SAT / Поступление</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎓 AI Coach</h1>
    <p data-i18n="subtitle">Подготовка к IELTS / TOEFL / SAT, эссе, портфолио, поступление за границу</p>
    <div class="lang-switch">
      <button onclick="setLang('ru')" id="btn-ru">RU</button>
      <button onclick="setLang('en')" id="btn-en">EN</button>
    </div>
  </header>

  <!-- Три большие кнопки экзаменов -->
  <div class="exam-switcher">
    <button class="exam-btn active" data-exam="IELTS" onclick="showExamPanel('IELTS')">
      <span class="exam-icon">📘</span>
      <span class="exam-name">IELTS</span>
      <span class="exam-desc" data-i18n="exam_ielts_desc">Academic / General</span>
    </button>
    <button class="exam-btn" data-exam="TOEFL" onclick="showExamPanel('TOEFL')">
      <span class="exam-icon">📗</span>
      <span class="exam-name">TOEFL</span>
      <span class="exam-desc" data-i18n="exam_toefl_desc">iBT Test</span>
    </button>
    <button class="exam-btn" data-exam="SAT" onclick="showExamPanel('SAT')">
      <span class="exam-icon">📕</span>
      <span class="exam-name">SAT</span>
      <span class="exam-desc" data-i18n="exam_sat_desc">Digital SAT</span>
    </button>
  </div>

  <!-- Вторичная навигация (эссе / план / портфолио / история) -->
  <nav class="secondary-nav">
    <button class="tab" data-tab="essay" data-i18n="tab_essay">✍️ Эссе-коуч</button>
    <button class="tab" data-tab="plan" data-i18n="tab_plan">🗓 План тренировок</button>
    <button class="tab" data-tab="portfolio" data-i18n="tab_portfolio">🎯 Портфолио</button>
    <button class="tab" data-tab="history" data-i18n="tab_history">📜 История</button>
  </nav>

  <!-- Панель выбранного экзамена -->
  <section id="exam-panel" class="panel active">
    <h2 id="exam-title">IELTS</h2>

    <!-- IELTS: Academic / General (только для IELTS) -->
    <div id="ielts-version-switcher" class="version-switcher">
      <button class="version-btn active" data-version="academic" onclick="setIeltsVersion('academic')">🎓 Academic</button>
      <button class="version-btn" data-version="general" onclick="setIeltsVersion('general')">💼 General Training</button>
    </div>

    <label><span data-i18n="label_section">Секция</span>:
      <select id="section"></select>
    </label>

    <label><span data-i18n="label_difficulty">Сложность</span>:
      <select id="difficulty"></select>
    </label>

    <label><span data-i18n="label_count">Сколько</span>:
      <input id="count" type="number" min="1" max="10" value="5">
    </label>

    <button class="action" onclick="generateExam()" data-i18n="btn_generate">Сгенерировать</button>
    <div id="tasks"></div>
  </section>

  <section id="tab-essay" class="panel">
    <button class="back-to-exams" onclick="showExamPanel(currentExam)" data-i18n="btn_back_to_exams">← Назад к экзаменам</button>
    <h2 data-i18n="essay_title">Разбор эссе (без написания за вас)</h2>
    <label><span data-i18n="label_uni">Университет</span>: <input id="uni" value="University of Toronto"></label>
    <label><span data-i18n="label_essay_type">Тип эссе</span>:
      <select id="essayType">
        <option>Personal Statement</option>
        <option>IELTS Task 2</option>
        <option>TOEFL Essay</option>
        <option>SAT Essay</option>
        <option>Supplemental Essay</option>
      </select>
    </label>
    <label><span data-i18n="label_prompt">Промпт</span>: <input id="prompt" value="Why do you want to study CS?"></label>
    <label><span data-i18n="label_draft">Черновик</span>:</label>
    <textarea id="draft" rows="8" data-i18n-placeholder="ph_draft" placeholder="Вставь свой черновик..."></textarea>
    <button class="action" onclick="coachEssay()" data-i18n="btn_analyze">Разобрать</button>
    <div id="essayOut"></div>
  </section>

  <section id="tab-plan" class="panel">
    <button class="back-to-exams" onclick="showExamPanel(currentExam)" data-i18n="btn_back_to_exams">← Назад к экзаменам</button>
    <h2 data-i18n="plan_title">Индивидуальный план тренировок</h2>
    <label><span data-i18n="label_target">Целевой балл</span>: <input id="pScore" type="number" step="0.5" value="8.0"></label>
    <label><span data-i18n="label_level">Текущий уровень</span>: <input id="pLevel" value="band6.5"></label>
    <label><span data-i18n="label_native">Родной язык</span>: <input id="pNative" value="Russian"></label>
    <label><span data-i18n="label_weeks">Недель</span>: <input id="pWeeks" type="number" value="12"></label>
    <label><span data-i18n="label_hours">Часов в неделю</span>: <input id="pHours" type="number" value="8"></label>
    <button class="action" onclick="makePlan()" data-i18n="btn_plan">Составить план</button>
    <div id="planOut"></div>
  </section>

  <section id="tab-portfolio" class="panel">
    <button class="back-to-exams" onclick="showExamPanel(currentExam)" data-i18n="btn_back_to_exams">← Назад к экзаменам</button>
    <h2 data-i18n="portfolio_title">Портфолио для поступления</h2>
    <label><span data-i18n="label_major">Специальность</span>: <input id="pfMajor" value="Computer Science"></label>
    <label><span data-i18n="label_unis">Вузы (через запятую)</span>:
      <input id="pfUnis" value="University of Toronto, MIT, ETH Zurich">
    </label>
    <label><span data-i18n="label_target">Целевой балл</span>: <input id="pfScore" type="number" step="0.5" value="8.5"></label>
    <label><span data-i18n="label_deadline">Недель до дедлайна</span>: <input id="pfWeeks" type="number" value="24"></label>
    <button class="action" onclick="buildPortfolio()" data-i18n="btn_portfolio">Собрать портфолио</button>
    <div id="pfOut"></div>
  </section>

  <section id="tab-history" class="panel">
    <button class="back-to-exams" onclick="showExamPanel(currentExam)" data-i18n="btn_back_to_exams">← Назад к экзаменам</button>
    <h2 data-i18n="history_title">История запросов</h2>
    <button class="action" onclick="loadHistory()" data-i18n="btn_load_history">Обновить</button>
    <div id="historyOut"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
